<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Azrael Security research — Below the abstraction.</title>
  <desc id="desc">A crimson blueprint of nested host, runtime, and workload boundaries on a light background.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d8dee6" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="glow">
      <stop stop-color="#b51f43" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#b51f43" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="12" fill="#f6f8fa"/>
  <rect x="1" y="1" width="1198" height="318" rx="11" fill="url(#grid)"/>
  <ellipse cx="971" cy="160" rx="260" ry="200" fill="url(#glow)"/>
  <path d="M44 30H128" stroke="#b51f43" stroke-width="3"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace">
    <text x="44" y="65" fill="#576170" font-size="15" letter-spacing="2.5">RESEARCH / SYSTEMS / SECURITY</text>
    <text x="38" y="170" fill="#1f2328" font-size="90" font-weight="700" letter-spacing="-5">Research<tspan fill="#b51f43">_</tspan></text>
    <text x="44" y="228" fill="#353e49" font-size="33" letter-spacing="-1">Below the abstraction.</text>
    <text x="44" y="285" fill="#576170" font-size="15" letter-spacing="1.3">DARRIUS GRATE / AZRAEL SECURITY</text>
  </g>
  <g fill="none" stroke-linejoin="round">
    <rect x="723" y="44" width="430" height="232" rx="8" stroke="#c08a9c"/>
    <rect x="779" y="96" width="318" height="144" rx="6" fill="#f4e4eb" stroke="#c35e79"/>
    <rect x="835" y="148" width="206" height="56" rx="4" fill="#f9dce5" stroke="#b51f43" stroke-width="2"/>
    <path d="M703 218H861V204M1041 176H1173" stroke="#b51f43" stroke-dasharray="4 6"/>
    <path d="M711 32H735M1141 288H1165M938 32V44M938 276V288" stroke="#b51f43"/>
  </g>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="1.5">
    <text x="743" y="73" fill="#576170">HOST</text>
    <text x="799" y="125" fill="#353e49">RUNTIME</text>
    <text x="938" y="181" fill="#b51f43" text-anchor="middle">WORKLOAD</text>
  </g>
  <g fill="#b51f43">
    <circle cx="703" cy="218" r="4"/>
    <circle cx="1173" cy="176" r="4"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="11.5" fill="none" stroke="#d0d7de"/>
</svg>
